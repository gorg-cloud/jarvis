name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Lightweight sanity check: every module imports on Linux + Windows Python.
  imports:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        shell: pwsh
        run: |
          pip install PyQt6 fastapi "uvicorn[standard]" websockets python-dotenv `
            httpx requests SpeechRecognition notion-client opencv-contrib-python `
            mediapipe matplotlib
      - name: Import every module
        run: python scripts/smoke_imports.py

  windows-build:
    runs-on: windows-latest
    needs: imports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        shell: pwsh
        run: |
          pip install PyQt6 pyinstaller fastapi "uvicorn[standard]" websockets python-dotenv `
            httpx requests SpeechRecognition notion-client opencv-contrib-python `
            mediapipe matplotlib
      - name: Generate icons
        run: python -m jarvis.app.make_icon --ico
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean jarvis/jarvis-app-win.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-windows
          path: dist/JARVIS/
